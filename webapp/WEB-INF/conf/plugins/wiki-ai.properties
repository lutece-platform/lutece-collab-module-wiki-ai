wiki.ai.elasticsearch.host=localhost
wiki.ai.elasticsearch.port=9200
wiki.ai.elasticsearch.protocol=http
wiki.ai.elasticsearch.username=
wiki.ai.elasticsearch.password=
wiki.ai.elasticsearch.index.prefix=wiki_ai_

wiki.ai.rag.max.results=10
wiki.ai.rag.min.score=0.7

wiki.ai.indexer.enable=true

wiki.ai.sse.max.concurrent.streams=50
wiki.ai.sse.stream.expiry.seconds=300

wiki.ai.chat.memory.max.messages=20
wiki.ai.chat.memory.ttl.minutes=30
wiki.ai.chat.memory.cleanup.interval.minutes=5

wiki.ai.rateLimit.messagesPerDay=100

# AI Model Configuration (CDI producers - ModelService.java)
wiki.ai.model.embedding.class=dev.langchain4j.model.azure.AzureOpenAiEmbeddingModel
wiki.ai.model.embedding.endpoint=https://example.openai.azure.com/
wiki.ai.model.embedding.apiKey=**
wiki.ai.model.embedding.deploymentName=text-embedding-ada-002

wiki.ai.model.streaming.class=dev.langchain4j.model.azure.AzureOpenAiStreamingChatModel
wiki.ai.model.streaming.endpoint=https://example.openai.azure.com/
wiki.ai.model.streaming.apiKey=**
wiki.ai.model.streaming.deploymentName=gpt-4.1-mini
wiki.ai.model.streaming.temperature=0.7

wiki.ai.model.chat.class=dev.langchain4j.model.azure.AzureOpenAiChatModel
wiki.ai.model.chat.endpoint=https://example.openai.azure.com/
wiki.ai.model.chat.apiKey=**
wiki.ai.model.chat.deploymentName=gpt-4.1-mini
wiki.ai.model.chat.temperature=0.7
