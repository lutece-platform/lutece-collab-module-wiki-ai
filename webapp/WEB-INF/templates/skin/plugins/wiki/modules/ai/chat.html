<#ftl output_format="HTML">
<link rel="stylesheet" href="css/plugins/wiki/github-highlight.css">
<link rel="stylesheet" href="css/plugins/wiki/wiki-marked.css">
<link rel="stylesheet" href="css/plugins/wiki/wiki-chat.css">

<div class="wiki-ai-chat-wrapper" id="wikiAiChatWrapper">
    <div class="wiki-ai-chat-overlay" id="wikiAiChatOverlay">
        <div class="wiki-ai-chat-container">
            <div class="wiki-ai-chat-layout" id="wikiAiChatLayout">
                <div class="wiki-ai-chat-main">
                    <div class="wiki-ai-chat-header">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M19.8978 16H7.89778C6.96781 16 6.50282 16 6.12132 16.1022C5.08604 16.3796 4.2774 17.1883 4 18.2235" stroke="#000" stroke-width="1.5"/>
                                <path d="M8 7H16" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M8 10.5H13" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M10 22C7.17157 22 5.75736 22 4.87868 21.1213C4 20.2426 4 18.8284 4 16V8C4 5.17157 4 3.75736 4.87868 2.87868C5.75736 2 7.17157 2 10 2H14C16.8284 2 18.2426 2 19.1213 2.87868C20 3.75736 20 5.17157 20 8M14 22C16.8284 22 18.2426 22 19.1213 21.1213C20 20.2426 20 18.8284 20 16V12" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            #i18n{module.wiki.ai.chat.modal.title}
                        </h3>
                        <button class="wiki-ai-chat-close" id="wikiAiChatCloseBtn" aria-label="#i18n{module.wiki.ai.chat.button.close}">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                    <div class="wiki-ai-chat-messages" id="wikiAiChatMessages">
                        <div class="wiki-ai-chat-welcome">
                            <div class="wiki-ai-chat-welcome-greeting">#i18n{module.wiki.ai.chat.welcome.greeting}</div>
                            <div class="wiki-ai-chat-welcome-text">#i18n{module.wiki.ai.chat.welcome.message}</div>
                        </div>
                    </div>
                </div>
                <div class="wiki-ai-source-panel" id="wikiAiSourcePanel">
                    <div class="wiki-ai-source-header">
                        <h4>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                                <polyline points="10 9 9 9 8 9"/>
                            </svg>
                            <span id="wikiAiSourceTitle">Source</span>
                        </h4>
                        <div>
                            <a href="#" class="wiki-ai-source-open-link" id="wikiAiSourceOpenLink" target="_blank" rel="noopener noreferrer">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                                    <polyline points="15 3 21 3 21 9"/>
                                    <line x1="10" y1="14" x2="21" y2="3"/>
                                </svg>
                                Ouvrir
                            </a>
                            <button class="wiki-ai-source-close" id="wikiAiSourceCloseBtn" aria-label="Fermer">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 6L6 18M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="wiki-ai-source-content wiki-markdown-content" id="wikiAiSourceContent"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="wiki-ai-chat-input-bar" id="wikiAiChatInputBar">
        <form class="wiki-ai-chat-form" id="wikiAiChatForm">
            <div class="wiki-ai-chat-input-wrapper">
                <textarea class="wiki-ai-chat-input" id="wikiAiChatInput"
                       placeholder="#i18n{module.wiki.ai.chat.placeholder}" required rows="1"></textarea>
                <div class="wiki-ai-chat-shortcut">Ctrl+I</div>
                <button type="submit" class="wiki-ai-chat-send btn btn-dark" id="wikiAiChatSendBtn" aria-label="#i18n{module.wiki.ai.chat.button.send}">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M10 14l11 -11"></path><path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5"></path></svg>
                </button>
            </div>
        </form>
    </div>
</div>

<script src="js/plugins/wiki/marked/marked-wiki.js"></script>
<script src="js/plugins/wiki/wiki-chat.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    WikiAIChat.init({});
});
</script>
